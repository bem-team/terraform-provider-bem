name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/bem-team/bem-go-sdk,github.com/stainless-sdks/bem-go

jobs:
  lint:
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/bem-terraform'
        run: |
          ./scripts/link 'github.com/stainless-sdks/bem-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  test:
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/bem-terraform'
        run: |
          ./scripts/link 'github.com/stainless-sdks/bem-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      # -race is required, not optional. internal/apijson is shared,
      # concurrently-invoked codegen infrastructure that every resource's
      # Create/Update marshaling routes through, so a change there can pass
      # `go test ./...` cleanly while hiding a data race that only appears
      # under real concurrent use - BEM-1367's corrupted ~99/100 calls under
      # -race and never once without it, and reached a release because CI
      # didn't run it. Acceptance tests stay skipped here (TF_ACC is unset);
      # they need a staging key and create real resources.
      - name: Run tests
        run: ./scripts/test -race