name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/bem-team/bem-go-sdk,github.com/bem-team/bem-go-sdk-staging

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate git for the private Go SDK repo
        shell: bash
        env:
          GO_MODULE_REPO: ${{ github.repository == 'bem-team/terraform-provider-bem-staging' && 'bem-team/bem-go-sdk-staging' || 'bem-team/bem-go-sdk' }}
        run: git config --global url."https://x-access-token:${{ secrets.GO_REPO_READ_TOKEN }}@github.com/${GO_MODULE_REPO}".insteadOf "https://github.com/${GO_MODULE_REPO}"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'bem-team/terraform-provider-bem-staging'
        run: |
          ./scripts/link 'github.com/bem-team/bem-go-sdk-staging@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate git for the private Go SDK repo
        shell: bash
        env:
          GO_MODULE_REPO: ${{ github.repository == 'bem-team/terraform-provider-bem-staging' && 'bem-team/bem-go-sdk-staging' || 'bem-team/bem-go-sdk' }}
        run: git config --global url."https://x-access-token:${{ secrets.GO_REPO_READ_TOKEN }}@github.com/${GO_MODULE_REPO}".insteadOf "https://github.com/${GO_MODULE_REPO}"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'bem-team/terraform-provider-bem-staging'
        run: |
          ./scripts/link 'github.com/bem-team/bem-go-sdk-staging@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      # -race is required, not optional. internal/apijson is shared,
      # concurrently-invoked codegen infrastructure that every resource's
      # Create/Update marshaling routes through, so a change there can pass
      # `go test ./...` cleanly while hiding a data race that only appears
      # under real concurrent use - BEM-1367's corrupted ~99/100 calls under
      # -race and never once without it, and reached a release because CI
      # didn't run it. Acceptance tests stay skipped here (TF_ACC is unset);
      # they need a staging key and create real resources.
      - name: Run tests
        run: ./scripts/test -race